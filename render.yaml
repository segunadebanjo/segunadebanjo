# Render Blueprint: one Node web service that runs the API and serves the built UI.
# In Render: New → Blueprint → pick this repository. See "Deploying to Render" in README.md.
#
# Render has no managed MySQL, so DATABASE_URL points at an external MySQL 8 database
# (e.g. Aiven), with ?sslaccept=strict on the end of the connection string.
services:
  - type: web
    name: insurance-ad-manager
    runtime: node
    plan: free # "starter" keeps it awake so the hourly sync/optimization jobs run
    branch: insurance-ad-manager-main
    autoDeploy: true
    healthCheckPath: /api/health
    # --include=dev: NODE_ENV=production would otherwise skip tsc/vite/prisma.
    # The build never touches the database, so it can't fail on a bad DATABASE_URL.
    buildCommand: >-
      npm --prefix server ci --include=dev &&
      npm --prefix client ci --include=dev &&
      npm --prefix server run db:generate &&
      npm run build
    # Check DATABASE_URL (plain-words error), apply pending migrations, then start. A database problem shows up
    # in the service's Logs (with Prisma's error) instead of failing the build.
    startCommand: npm --prefix server run db:check && npm --prefix server run db:deploy && npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SANDBOX_MODE
        value: "true"
      # Secrets generated by Render on first deploy.
      - key: AUTH_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET_KEY
        generateValue: true
      # Asked for when the Blueprint is created.
      - key: DATABASE_URL
        sync: false
      - key: APP_URL # e.g. https://insurance-ad-manager.onrender.com
        sync: false
      - key: CORS_ORIGIN # same as APP_URL
        sync: false
      # Optional: password-reset emails.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Optional: AI-written ad copy (templates are used without it).
      - key: ANTHROPIC_API_KEY
        sync: false
